<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Graph Harness SDLC cats</title>
  <desc id="desc">Three cat-shaped graph nodes connected by directed edges, representing specification, execution, and verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#59636e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#f6f8fa"/>

  <path d="M334 170 C420 95 490 95 574 170" fill="none" stroke="#59636e" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M626 170 C710 95 780 95 866 170" fill="none" stroke="#59636e" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M850 230 C700 315 500 315 350 230" fill="none" stroke="#8c959f" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(120 70)" filter="url(#shadow)">
    <path d="M30 66 L58 18 L88 54 Q120 36 152 54 L182 18 L210 66 Q224 88 224 126 Q224 204 120 204 Q16 204 16 126 Q16 88 30 66Z" fill="#ffffff" stroke="#1f2328" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="86" cy="115" r="8" fill="#1f2328"/><circle cx="154" cy="115" r="8" fill="#1f2328"/>
    <path d="M111 138 Q120 148 129 138" fill="none" stroke="#1f2328" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 145 L120 158" stroke="#1f2328" stroke-width="6" stroke-linecap="round"/>
    <rect x="66" y="174" width="108" height="28" rx="14" fill="#0969da"/>
    <circle cx="120" cy="188" r="9" fill="#ffffff"/>
    <text x="120" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#1f2328">SPEC</text>
  </g>

  <g transform="translate(480 70)" filter="url(#shadow)">
    <path d="M30 66 L58 18 L88 54 Q120 36 152 54 L182 18 L210 66 Q224 88 224 126 Q224 204 120 204 Q16 204 16 126 Q16 88 30 66Z" fill="#ffffff" stroke="#1f2328" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="86" cy="115" r="8" fill="#1f2328"/><circle cx="154" cy="115" r="8" fill="#1f2328"/>
    <path d="M111 138 Q120 148 129 138" fill="none" stroke="#1f2328" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 145 L120 158" stroke="#1f2328" stroke-width="6" stroke-linecap="round"/>
    <rect x="66" y="174" width="108" height="28" rx="14" fill="#1a7f37"/>
    <circle cx="120" cy="188" r="9" fill="#ffffff"/>
    <text x="120" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#1f2328">EXECUTE</text>
  </g>

  <g transform="translate(840 70)" filter="url(#shadow)">
    <path d="M30 66 L58 18 L88 54 Q120 36 152 54 L182 18 L210 66 Q224 88 224 126 Q224 204 120 204 Q16 204 16 126 Q16 88 30 66Z" fill="#ffffff" stroke="#1f2328" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="86" cy="115" r="8" fill="#1f2328"/><circle cx="154" cy="115" r="8" fill="#1f2328"/>
    <path d="M111 138 Q120 148 129 138" fill="none" stroke="#1f2328" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 145 L120 158" stroke="#1f2328" stroke-width="6" stroke-linecap="round"/>
    <rect x="66" y="174" width="108" height="28" rx="14" fill="#8250df"/>
    <circle cx="120" cy="188" r="9" fill="#ffffff"/>
    <text x="120" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#1f2328">VERIFY</text>
  </g>
</svg>
